<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voz em Música • IA Musical</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #131b2e;
      --card-border: #1f2d4d;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #a5b4fc, #6366f1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dropzone {
      border: 2px dashed var(--card-border);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .dropzone:hover {
      border-color: var(--accent);
      background-color: rgba(99, 102, 241, 0.05);
    }

    .dropzone input {
      display: none;
    }

    .dropzone-text {
      font-size: 14px;
      color: var(--text-muted);
    }

    .dropzone-text strong {
      color: var(--accent);
    }

    .file-name {
      margin-top: 8px;
      font-size: 13px;
      color: var(--success);
      font-weight: 500;
      word-break: break-all;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    select, input[type="number"] {
      width: 100%;
      background: #0d1322;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--accent);
    }

    .instruments-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .checkbox-tag {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #0d1322;
      border: 1px solid var(--card-border);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-tag input {
      accent-color: var(--accent);
    }

    .btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      min-height: 20px;
    }

    #status.err {
      color: var(--danger);
    }

    #result {
      display: none;
      margin-top: 24px;
      background: #0d1322;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
    }

    #result audio {
      width: 100%;
      margin-bottom: 12px;
      outline: none;
    }

    .meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-align: center;
    }

    .downloads {
      display: flex;
      gap: 8px;
    }

    .downloads a {
      flex: 1;
      text-align: center;
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid var(--accent);
      color: #a5b4fc;
      text-decoration: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
    }

    .downloads a:hover {
      background: var(--accent);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Voz em Música</h1>
      <p class="subtitle">Grave ou envie um áudio cantando e crie uma produção musical com harmonia completa.</p>
    </header>

    <form id="form">
      <div class="form-group">
        <label>Áudio da sua Voz</label>
        <div class="dropzone" id="dropzone">
          <input type="file" id="audio" accept="audio/*,video/*" />
          <div class="dropzone-text">
            <strong>Clique para escolher</strong> ou arraste seu áudio aqui
          </div>
          <div class="file-name" id="fileName"></div>
        </div>
      </div>

      <div class="form-group grid-2">
        <div>
          <label for="style">Estilo Harmônico</label>
          <select id="style">
            <option value="gospel">Gospel / Adoração</option>
            <option value="pop">Pop / Acústico</option>
            <option value="sertanejo">Sertanejo</option>
            <option value="lofi">Lo-Fi / Suave</option>
          </select>
        </div>
        <div>
          <label for="bpm">BPM (Andamento)</label>
          <input type="number" id="bpm" value="72" min="45" max="180" />
        </div>
      </div>

      <div class="form-group">
        <label>Instrumentos no Arranjo</label>
        <div class="instruments-grid">
          <label class="checkbox-tag"><input type="checkbox" name="inst" value="piano" checked /> Piano</label>
          <label class="checkbox-tag"><input type="checkbox" name="inst" value="pad" checked /> Pad</label>
          <label class="checkbox-tag"><input type="checkbox" name="inst" value="cordas" checked /> Cordas</label>
          <label class="checkbox-tag"><input type="checkbox" name="inst" value="violao" checked /> Violão</label>
          <label class="checkbox-tag"><input type="checkbox" name="inst" value="baixo" checked /> Baixo</label>
          <label class="checkbox-tag"><input type="checkbox" name="inst" value="bateria" checked /> Bateria</label>
        </div>
      </div>

      <div class="form-group">
        <label class="checkbox-tag" style="padding: 10px;">
          <input type="checkbox" id="keepVoice" checked />
          <span>Manter minha voz na música final (Mixada)</span>
        </label>
      </div>

      <button type="submit" class="btn" id="btnSubmit">Criar Música Agora</button>
    </form>

    <div id="status"></div>

    <div id="result">
      <audio id="player" controls></audio>
      <div class="meta" id="meta"></div>
      <div class="downloads">
        <a id="wavLink" download="musica_final.wav">Baixar Áudio WAV</a>
        <a id="midiLink" download="arranjo.mid">Baixar MIDI</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const audioInput = document.getElementById("audio");
    const dropzone = document.getElementById("dropzone");
    const fileName = document.getElementById("fileName");
    const btnSubmit = document.getElementById("btnSubmit");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const player = document.getElementById("player");
    const meta = document.getElementById("meta");
    const wavLink = document.getElementById("wavLink");
    const midiLink = document.getElementById("midiLink");

    dropzone.addEventListener("click", () => audioInput.click());
    audioInput.addEventListener("change", () => {
      if (audioInput.files.length) {
        fileName.textContent = "Arquivo selecionado: " + audioInput.files[0].name;
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!audioInput.files.length) {
        status.className = "err";
        status.textContent = "Por favor, selecione um arquivo de áudio antes de continuar.";
        return;
      }

      const instruments = Array.from(
        document.querySelectorAll('input[name="inst"]:checked')
      ).map((i) => i.value);

      const data = new FormData();
      data.append("audio", audioInput.files[0]);
      data.append("style", document.getElementById("style").value);
      data.append("bpm", document.getElementById("bpm").value);
      data.append("keepVoice", document.getElementById("keepVoice").checked);
      data.append("instruments", JSON.stringify(instruments));

      btnSubmit.disabled = true;
      result.style.display = "none";
      status.className = "";
      status.textContent = "Analisando sua voz, detectando o tom e criando o arranjo…";

      try {
        const response = await fetch("/api/generate", {
          method: "POST",
          body: data
        });

        const rawText = await response.text();
        let dataResponse = {};

        try {
          if (rawText) {
            dataResponse = JSON.parse(rawText);
          }
        } catch (erro) {
          throw new Error(
            `O servidor respondeu de forma inválida (código ${response.status}). Aguarde um pouco e tente novamente.`
          );
        }

        if (!response.ok) {
          throw new Error(dataResponse.error || "Não foi possível gerar a música.");
        }

        player.src = dataResponse.audioUrl;
        wavLink.href = dataResponse.audioUrl;
        midiLink.href = dataResponse.midiUrl;

        meta.textContent =
          `Tom detectado: ${dataResponse.key} • ` +
          `${dataResponse.bpm} BPM • ` +
          `${dataResponse.duration}s de música • ` +
          `${dataResponse.bars} compassos`;

        result.style.display = "block";
        status.textContent = "Música criada com sucesso!";
      } catch (err) {
        status.className = "err";
        status.textContent = err.message;
      } finally {
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
